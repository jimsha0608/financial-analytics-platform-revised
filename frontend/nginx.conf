server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that doesn't match
    # a real static file (e.g. /transactions) must still fall back to
    # index.html and let the SPA's router handle it - otherwise nginx 404s
    # on a hard refresh or direct link to anything but "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
